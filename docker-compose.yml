# Local trial with Docker:   docker compose up --build        → http://localhost:3000  (demo company included)
# Production on a server:    see DEPLOY.md (uses docker-compose.prod.yml on top of this file)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizos}
      POSTGRES_DB: bizos
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bizos"], interval: 5s, retries: 10 }

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://bizos:${POSTGRES_PASSWORD:-bizos}@db:5432/bizos
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@bizos.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin1234}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      SEED_DEMO: ${SEED_DEMO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes: ["appdata:/data"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${API_URL:-http://localhost:8000}" }
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  appdata:
